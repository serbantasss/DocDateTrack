# DocDateTrack with MongoDB, for self-hosting and local development.
#
# Self-hosting: put this file and a `.env` file (copied from .env.example, with SESSION_SECRET set)
# in a directory and run `docker compose up -d`. See docs/deployment.md.
# Local development: `docker compose up -d mongo` starts only MongoDB, reachable from your machine
# at 127.0.0.1:27018 (MONGODB_PORT). See CONTRIBUTING.md.

services:
  app:
    image: ghcr.io/serbantasss/docdatetrack:${DOCDATETRACK_VERSION:-latest}
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8080}:8080'
    volumes:
      - uploads:/data/uploads
    environment:
      # Fixed for the container: the values in .env for running Node.js locally do not apply here.
      NODE_ENV: production
      PORT: '8080'
      MONGODB_URI: mongodb://mongo:27017/${MONGODB_DATABASE:-docdatetrack}
      UPLOAD_DIR: /data/uploads
      # Settings from .env or the shell; empty values use the defaults listed in .env.example.
      # The app refuses to start without SESSION_SECRET.
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      APP_NAME: ${APP_NAME:-}
      APP_URL: ${APP_URL:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
      EXPIRY_WARNING_DAYS: ${EXPIRY_WARNING_DAYS:-}
      DATE_LOCALE: ${DATE_LOCALE:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      TZ: ${TZ:-UTC}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-}
      REMINDER_CRON: ${REMINDER_CRON:-}
      NOTIFY_OWNERS: ${NOTIFY_OWNERS:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-LocalDemoOnly123!}

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # Published on the loopback interface only, for local development and maintenance.
    ports:
      - '127.0.0.1:${MONGODB_PORT:-27018}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo-data:
  uploads:
